# Installable test builds of the browser feature. Artifacts only: no release, store upload, or updater metadata.
name: Browser test builds

on:
  push:
    branches: [atanas/mobile-browser-build]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-build-${{ github.ref }}
  cancel-in-progress: false

env:
  BUILD_VERSION: 1.32.1-browser.${{ github.run_number }}

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:browser
      - run: npm run test:mobile-i18n
      - name: Set test version
        run: npm version "$env:BUILD_VERSION" --no-git-tag-version --allow-same-version
      - name: Build Windows installer
        run: npx electron-builder --win --publish never --config.directories.output=dist/browser-preview
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Checksums and source revision
        shell: pwsh
        run: |
          $files = Get-ChildItem -LiteralPath dist/browser-preview -Filter '*.exe'
          if ($files.Count -ne 1) { throw 'Expected exactly one Windows installer' }
          $files | ForEach-Object { $hash = Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256; "$($hash.Hash.ToLower())  $($_.Name)" } | Set-Content -Encoding utf8 dist/browser-preview/SHA256SUMS.txt
          @("AgentDeck browser test build", "Version: $env:BUILD_VERSION", "Source: $env:GITHUB_SHA", "Repository: $env:GITHUB_REPOSITORY") | Set-Content -Encoding utf8 dist/browser-preview/BUILD-INFO.txt
      - uses: actions/upload-artifact@v7
        with:
          name: agentdeck-browser-windows
          path: |
            dist/browser-preview/*.exe
            dist/browser-preview/SHA256SUMS.txt
            dist/browser-preview/BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 30

  android:
    name: Android preview APK
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --ignore-scripts
      - run: npm ci
        working-directory: mobile
      - run: npm run test:browser
      - run: npm run test:mobile-i18n
      - name: Build side-by-side test APK
        working-directory: mobile
        run: npm run apk
        env:
          AGENTDECK_VERSION: ${{ env.BUILD_VERSION }}
          AGENTDECK_PREVIEW: "true"
      - name: Verify APK, checksum and source revision
        shell: bash
        run: |
          set -euo pipefail
          apk="mobile/android/app/build/outputs/apk/debug/app-debug.apk"
          tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$tools/apksigner" verify "$apk"
          "$tools/aapt" dump badging "$apk" > "$RUNNER_TEMP/apk-info.txt"
          grep "package: name='com.mitrevstudio.agentdeck.preview'" "$RUNNER_TEMP/apk-info.txt"
          grep "application-label:'AgentDeck Browser'" "$RUNNER_TEMP/apk-info.txt"
          mkdir -p dist/browser-preview
          cp "$apk" "dist/browser-preview/AgentDeck-Browser-$BUILD_VERSION.apk"
          cd dist/browser-preview
          sha256sum ./*.apk > SHA256SUMS.txt
          printf 'AgentDeck browser test build\nVersion: %s\nSource: %s\nRepository: %s\nAndroid package: com.mitrevstudio.agentdeck.preview\n' "$BUILD_VERSION" "$GITHUB_SHA" "$GITHUB_REPOSITORY" > BUILD-INFO.txt
      - uses: actions/upload-artifact@v7
        with:
          name: agentdeck-browser-android
          path: |
            dist/browser-preview/*.apk
            dist/browser-preview/SHA256SUMS.txt
            dist/browser-preview/BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 30
